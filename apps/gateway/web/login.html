<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AyurTrace — Sign in</title>
<link rel="stylesheet" href="/assets/theme.css" />
<style>
  .login-wrap{max-width:560px;margin:8vh auto;padding:0 16px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .role-card{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:16px;cursor:pointer;
    transition:.15s;text-align:left}
  .role-card:hover{border-color:var(--leaf);background:var(--leaf-tint);transform:translateY(-1px)}
  .role-card.sel{border-color:var(--leaf);background:var(--leaf-tint);box-shadow:0 0 0 2px #bcd6c6}
  .role-card .rt{font-weight:600;color:var(--ink)}
  .role-card .rd{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .name-row{margin-top:16px}
  .name-row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .denied{background:var(--clay-tint);border:1px solid #e3b8ac;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="login-wrap">
  <h1 class="page-h">Sign in to AyurTrace</h1>
  <p class="page-sub">Each party works from their own device and enters only their own data.
    Pick your role — your actions on the ledger are recorded as you.</p>
  <div id="denied"></div>
  <div class="name-row">
    <label class="small muted">Your name / ID</label>
    <input id="name" placeholder="e.g. Ramesh (Collector) or Dr. Rao (Lab)" />
  </div>
  <div class="roles" id="roles"></div>
</div>
<script src="/assets/app.js"></script>
<script>
const ROLES = [
  { role:'COLLECTOR',   go:'/collector.html', title:'Collector / Farmer', desc:'Log herb collections from the field' },
  { role:'LAB',         go:'/lab.html',       title:'Accredited Lab',     desc:'Upload lab reports, submit quality tests' },
  { role:'MANUFACTURER',go:'/operator.html',  title:'Manufacturer',       desc:'Aggregate, process, formulate, commission QR' },
  { role:'REGULATOR',   go:'/regulator.html', title:'Regulator (NMPB)',   desc:'Audit, co-sign quality tests, recall' },
  { role:'CONSUMER',    go:'/consumer.html',  title:'Consumer',           desc:'Scan a QR and verify provenance' },
];
const params = new URLSearchParams(location.search);
if(params.get('denied')){
  document.getElementById('denied').innerHTML =
    `<div class="denied">That page is for the <b>${AT.esc(params.get('denied'))}</b> role. Sign in with the right role to continue.</div>`;
}
const box = document.getElementById('roles'); let sel = null;
ROLES.forEach(r=>{
  const c = AT.el('div', {class:'role-card'}, `<div class="rt">${r.title}</div><div class="rd">${r.desc}</div>`);
  c.addEventListener('click', ()=>{
    const name = (document.getElementById('name').value || '').trim() || r.title;
    AT.signIn(r.role, name);
    location.href = params.get('next') || r.go;
  });
  box.appendChild(c);
});
</script>
</body>
</html>
