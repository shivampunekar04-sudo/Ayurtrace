name: complete-b CI

on:
  push:
    branches: [main, master]
    paths: ['complete-b/**', '.github/workflows/complete-b-ci.yml']
  pull_request:
    paths: ['complete-b/**', '.github/workflows/complete-b-ci.yml']

defaults:
  run:
    working-directory: complete-b

jobs:
  test:
    name: typecheck + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: complete-b/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Offline-only: unit tests read a committed real-TSA token fixture, so no network is
  # needed. The live checks (npm run tsa:live, npm run smoke) are intentionally NOT in CI —
  # they hit external services and a local dev gateway.
